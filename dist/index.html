    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

  <body class="bg-secondary">
    <div id="root"></div>
    <script>
      // O Service Worker é só para a versão web (PWA). No aplicativo nativo
      // ele conflita com o WebView do Capacitor, que já serve os arquivos
      // localmente e usa a API remota em outro domínio.
      // O bridge nativo injeta window.Capacitor antes do app carregar. A flag
      // `isNative` existe desde o início; `isNativePlatform()` só depois que o
      // JS do Capacitor roda — por isso checamos as duas.
      var cap = window.Capacitor;
      var isNativeApp = !!(cap && (cap.isNative === true ||
        (typeof cap.isNativePlatform === 'function' && cap.isNativePlatform())));

      if (!isNativeApp && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
            console.log('SW registrado com sucesso:', reg.scope);
          }).catch(err => {
            console.log('Falha ao registrar SW:', err);
          });
        });
      }

      // Handle install prompt (apenas web)
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('PWA está pronto para ser instalado');
      });
    </script>
  </body>
</html>
