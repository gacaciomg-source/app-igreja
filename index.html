<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Igreja Renovar">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Igreja Renovar">
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="https://renovar.warpserver.com.br/icon1024.png">
    <link rel="icon" type="image/png" href="https://renovar.warpserver.com.br/icon1024.png">
    <link rel="manifest" href="/manifest.json" />
    <title>Igreja Renovar</title>
  </head>
  <body class="bg-secondary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
            console.log('SW registrado com sucesso:', reg.scope);
          }).catch(err => {
            console.log('Falha ao registrar SW:', err);
          });
        });
      }

      // Handle install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('PWA está pronto para ser instalado');
      });
    </script>
  </body>
</html>
